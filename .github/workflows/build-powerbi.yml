name: Preparar Power BI

on:
  workflow_dispatch:
    inputs:
      max_inputs:
        description: "Recursos silver por base (0 = todos)"
        required: false
        default: "0"

permissions:
  id-token: write
  contents: read

concurrency:
  group: bi-inss-powerbi-producao
  cancel-in-progress: false

jobs:
  preparar:
    name: ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 330

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset:
          - concedidos
          - emitidos
          - indeferidos
          - mantidos
          - cat
          - solicitados
          - pendentes
          - unidades
          - folha_emitidos

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Login Microsoft Entra via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Gerar camada Power BI
        env:
          SHAREPOINT_SITE_ID: "universoprevidenciario.sharepoint.com,b4ca13e8-7517-4e58-bb82-4cb8f8e06866,c2bf221a-26c3-4ff9-8dd3-648cb5cc1552"
          SHAREPOINT_BASE_FOLDER: "INSS"
          POWERBI_MAX_INPUTS: ${{ github.event.inputs.max_inputs || '0' }}
        run: |
          python build_powerbi.py \
            --dataset "${{ matrix.dataset }}" \
            --max-inputs "$POWERBI_MAX_INPUTS"
